[project]
name = "claimlens"
version = "1.0.0"
description = "Multi-modal damage-claim evidence review for cars, laptops and packages"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["claims", "vision-language-model", "evidence-review", "insurance", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "vortex-ai-gateway>=0.0.1a1",
    "python-dotenv>=1.0",
]

[project.scripts]
claimlens = "claimlens.cli:main"

[project.urls]
Homepage = "https://github.com/BenvinD/claimlens"
Repository = "https://github.com/BenvinD/claimlens"
Issues = "https://github.com/BenvinD/claimlens/issues"

[tool.uv.sources]
# Not published to PyPI. Resolved from the sibling checkout, which is ahead of
# the GitHub remote (`cache.py` is local-only and `gateway.py` imports it).
vortex-ai-gateway = { path = "../vortex-ai-gateway" }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimlens"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # long lines in prompt/report literals are intentional
    "B008",   # pydantic-style defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
